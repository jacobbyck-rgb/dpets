<title>Order Study Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dock-door header with KPI strip, tab rail, one working panel per tab. Freight-label type, safety-amber accent on slate. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2329; --muted:#5b6670; --line:#d9ddd8; --soft:#e9ecea;
  --accent:#d98e04; --accent-ink:#7a4f00; --accent-soft:#fbefd6;
  --good:#2f7d4f; --good-soft:#e2f1e7; --warn:#b5530f; --warn-soft:#fbe7d8; --bad:#b3261e; --bad-soft:#f9e0de;
  --t-qb:#5b4fc4; --t-cov:#0b7a8a; --t-own:#d98e04; --t-ops:#2f7d4f; --t-acct:#8a4b9e;
  --wood:#a87b4f; --case:#e8d3a8; --case-line:#b99a62; --wrap:#5aa7d6; --floor:#8b949c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191d; --panel:#1d2227; --ink:#e7eaec; --muted:#9aa5ae; --line:#323a41; --soft:#262c32;
  --accent:#f2a91f; --accent-ink:#f6c45f; --accent-soft:#3a2d12;
  --good:#5cc286; --good-soft:#1c3326; --warn:#ef8a4a; --warn-soft:#3a2416; --bad:#ef6b62; --bad-soft:#3b1d1b;
  --t-qb:#9b90ff; --t-cov:#4fc3d2; --t-own:#f2a91f; --t-ops:#5cc286; --t-acct:#c98be0;
  --wood:#8a6540; --case:#9c8a66; --case-line:#6f5f42; --wrap:#6fb9e6; --floor:#5c656d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191d; --panel:#1d2227; --ink:#e7eaec; --muted:#9aa5ae; --line:#323a41; --soft:#262c32;
  --accent:#f2a91f; --accent-ink:#f6c45f; --accent-soft:#3a2d12;
  --good:#5cc286; --good-soft:#1c3326; --warn:#ef8a4a; --warn-soft:#3a2416; --bad:#ef6b62; --bad-soft:#3b1d1b;
  --t-qb:#9b90ff; --t-cov:#4fc3d2; --t-own:#f2a91f; --t-ops:#5cc286; --t-acct:#c98be0;
  --wood:#8a6540; --case:#9c8a66; --case-line:#6f5f42; --wrap:#6fb9e6; --floor:#5c656d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:34px;font-weight:700;text-transform:uppercase;line-height:1}
h2{font-size:22px;font-weight:600;text-transform:uppercase}
h3{font-size:18px;font-weight:600}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.hazard{height:6px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--ink) 10px 20px);width:120px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 15px var(--display);text-transform:uppercase;letter-spacing:.04em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.relay{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;counter-reset:step}
.step{border:1px solid var(--line);border-top:4px solid var(--team);border-radius:6px;padding:10px;display:grid;gap:4px;background:var(--panel)}
.step.gate{background:var(--accent-soft);border-color:var(--accent);border-top-color:var(--team)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step strong{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.15}
.team{font-size:12px;font-weight:600;color:var(--team)}
.step p{margin:0;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--team);margin-right:5px;vertical-align:-1px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.plain{background:var(--soft);color:var(--muted)}
.tag{font-family:var(--mono);font-weight:500;font-size:12px;border:1.5px solid var(--ink);border-radius:3px;padding:1px 6px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.order{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.order-head{display:grid;gap:8px;padding:14px 16px}
.order-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.metrics div{display:grid}
.metrics b{font-family:var(--mono);font-size:15px;font-weight:500}
.metrics span{font-size:11.5px;color:var(--muted)}
details.more{border-top:1px solid var(--line)}
details.more>summary{cursor:pointer;padding:10px 16px;font-weight:600;font-size:13px;color:var(--accent-ink);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ ";font-family:var(--mono)}
details.more[open]>summary::before{content:"\2013 "}
.more-body{padding:0 16px 16px;display:grid;gap:14px}
ol.timeline{list-style:none;margin:0;padding:0;display:grid;gap:6px;border-left:2px solid var(--line)}
ol.timeline li{padding-left:12px;position:relative;font-size:13px}
ol.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
ol.timeline .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.lists ul{margin:4px 0 0;padding-left:18px;font-size:13px}
ol.steps{margin:0;padding-left:22px;display:grid;gap:6px}
ol.steps li::marker{font-family:var(--mono);color:var(--accent-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1.5px solid var(--ink);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
td.nowrap{white-space:nowrap}
input[type=search],input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{min-height:56px;resize:vertical}
.btn{font:600 13px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.row>*{min-width:0}
.q{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.q input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.q.done .qtext{text-decoration:line-through;color:var(--muted)}
.rule{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child,.q:last-child{border-bottom:0}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:20px;color:var(--muted);text-align:center}
.note{font-size:12.5px;color:var(--muted)}
.howto{display:grid;gap:4px;font-size:13px}
.howto code{font-family:var(--mono);background:var(--soft);padding:1px 5px;border-radius:3px}
.sub{display:flex;flex-wrap:wrap;gap:6px}
.defects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.defect{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sev);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start}
.defect svg{width:100%;height:auto;background:var(--soft);border-radius:6px}
.defect dl{margin:0;display:grid;gap:6px;font-size:13px}
.defect dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.defect dd{margin:0}
.sev{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--sev)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}
.photo{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;align-content:start}
.shot{position:relative;background:#111;line-height:0}
.shot img{width:100%;height:auto;display:block}
.spot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1d2329;font:600 13px var(--mono);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);line-height:1}
.photo-body{padding:14px;display:grid;gap:10px}
ol.spots{margin:0;padding-left:22px;display:grid;gap:4px;font-size:13px}
ol.spots li::marker{font-family:var(--mono);font-weight:600;color:var(--accent-ink)}
.quiz{display:grid;gap:12px;max-width:760px}
.opts{display:grid;gap:8px}
.opt{font:500 14px var(--body);text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{font-family:var(--mono);font-size:13px}
.checklist{display:grid;gap:10px;counter-reset:c}
.checklist li{display:grid;gap:2px}
form.up{display:grid;gap:10px}
form.up .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.tickgrid{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.tickgrid label{display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:no-preference){.order,.box{transition:border-color .15s}.order:hover{border-color:var(--muted)}}
</style>

<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:8px">
      <div class="hazard" aria-hidden="true"></div>
      <h1>Order Study Board</h1>
      <div class="muted">Every order, start to finish: what happened, what it paid, what it taught.</div>
    </div>
    <div class="note" id="syncState">Connecting…</div>
  </header>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="orders">Orders</button>
    <button role="tab" data-tab="load">Read the Load</button>
    <button role="tab" data-tab="processes">Processes</button>
    <button role="tab" data-tab="warehouses">Warehouses</button>
    <button role="tab" data-tab="rules">Rules</button>
    <button role="tab" data-tab="glossary">Glossary</button>
    <button role="tab" data-tab="questions">Questions</button>
  </nav>

  <main id="view" class="panel"></main>
</div>

<script>
const TEAMS = {
  qb:{name:"QB team",c:"var(--t-qb)"}, cov:{name:"Coverage",c:"var(--t-cov)"}, own:{name:"Account owner (you)",c:"var(--t-own)"},
  ops:{name:"Ops",c:"var(--t-ops)"}, acct:{name:"Accounting",c:"var(--t-acct)"}
};
const RELAY = [
  {s:"New order",t:"qb",d:"Request lands on the load board / Front. QB opens the channel, tags teams, replies to cx fast."},
  {s:"Sourcing + quotes",t:"cov",d:"Coverage calls warehouses, gets a bid, saves the WHS and cx quotes in the app."},
  {s:"Quote Approved",t:"own",d:"You chase the yes, update the app and give Ops the GTG."},
  {s:"ETA Received",t:"ops",d:"Driver name, phone, truck and trailer. Ops phones the WHS and gives the driver our ID."},
  {s:"On Site",t:"ops",d:"Arrival pictures to the customer."},
  {s:"In Process",t:"ops",d:"Progress pictures; confirm the scope on the dock."},
  {s:"Complete",t:"own",d:"Completion + seal pictures and payment settled, then release the driver.",gate:true},
  {s:"Invoiced",t:"acct",d:"Final WHS and cx costs, vendor invoice checked, invoice sent."}
];
const COLS = ["orders","processes","rules","warehouses","terms","questions","defects","photos"];
const state = {orders:[],processes:[],rules:[],warehouses:[],terms:[],questions:[],defects:[],photos:[]};
let loaded = false, db = null, canWrite = true, assets = null;
const ui = {tab:"overview", svc:"All", whRegion:"All", q:"", loadSub:"guide", quiz:{i:0, picked:null, right:0, seen:0}};
try{ const t = localStorage.getItem("osb.tab"); if(t) ui.tab = t; }catch(e){}
if(/^#[a-z]+$/.test(location.hash)) ui.tab = location.hash.slice(1);

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n==null||n==="") ? "—" : "$" + Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
const pct = (a,b) => (a&&b) ? Math.round((b-a)/b*100) + "%" : "—";
const byDate = (a,b) => String(b.date||"").localeCompare(String(a.date||""));
const wnSort = (a,b) => String(b.wn||b.id).localeCompare(String(a.wn||a.id));

function outcomePill(o){
  const k = (o||"").toLowerCase();
  if(k==="clean") return '<span class="pill good">Ran clean</span>';
  if(k==="rough") return '<span class="pill warn">Rough</span>';
  if(k==="failed") return '<span class="pill bad">Failed</span>';
  if(k==="open") return '<span class="pill plain">In progress</span>';
  return o ? `<span class="pill plain">${esc(o)}</span>` : "";
}
function ratingPill(r){
  const k=(r||"").toLowerCase();
  if(k==="go-to") return '<span class="pill good">Go-to</span>';
  if(k==="ok") return '<span class="pill plain">OK</span>';
  if(k==="watch") return '<span class="pill warn">Watch closely</span>';
  if(k==="avoid") return '<span class="pill bad">Avoid</span>';
  if(k==="no cap") return '<span class="pill plain">No capacity yet</span>';
  return r ? `<span class="pill plain">${esc(r)}</span>` : "";
}

function renderKpis(){
  const o = state.orders;
  const withMoney = o.filter(x=>x.cost&&x.billed);
  const cost = withMoney.reduce((s,x)=>s+Number(x.cost),0), billed = withMoney.reduce((s,x)=>s+Number(x.billed),0);
  const openQ = state.questions.filter(q=>!q.done).length;
  const k = [
    [o.length,"orders studied"],
    [state.processes.length,"processes learned"],
    [billed ? pct(cost,billed) : "—","blended margin"],
    [billed ? money(Math.round(billed-cost)) : "—","gross profit studied"],
    [state.rules.length,"rules learned"],
    [state.warehouses.length,"warehouses known"],
    [state.photos.length,"photos studied"],
    [openQ,"open questions"]
  ];
  $("#kpis").innerHTML = k.map(([v,l])=>`<div class="kpi"><b class="num">${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
}

function relayHtml(){
  const legend = Object.values(TEAMS).map(t=>`<span style="--team:${t.c}"><i></i>${esc(t.name)}</span>`).join("");
  const steps = RELAY.map((r,i)=>`<div class="step${r.gate?" gate":""}" style="--team:${TEAMS[r.t].c}">
      <span class="n">${String(i+1).padStart(2,"0")}${r.gate?" · GATE":""}</span><strong>${esc(r.s)}</strong>
      <span class="team">${esc(TEAMS[r.t].name)}</span><p>${esc(r.d)}</p></div>`).join("");
  return `<div class="box"><div><h2>How an order moves</h2><div class="muted">A relay between teams. You own the customer the whole way and step in when a hand-off stalls.</div></div>
    <div class="legend">${legend}</div><div class="relay">${steps}</div></div>`;
}

function orderCard(o, open){
  const m = [
    ["Pallets", o.pallets ?? "—"], ["WHS cost", money(o.cost)], ["Billed", money(o.billed)],
    ["Margin", o.cost&&o.billed ? money(Math.round(o.billed-o.cost)) : "—"], ["Margin %", pct(o.cost,o.billed)],
    ["Order → invoice", o.cycle || "—"]
  ].map(([l,v])=>`<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
  const tl = (o.timeline||[]).map(e=>`<li><span class="when">${esc(e.when)}</span>${esc(e.text)}</li>`).join("");
  const li = a => (a||[]).map(x=>`<li>${esc(x)}</li>`).join("") || "<li class='muted'>—</li>";
  return `<article class="order">
    <div class="order-head">
      <div class="order-title"><span class="tag">WN-${esc(o.wn||o.id)}</span><h3>${esc(o.customer)}</h3>${outcomePill(o.outcome)}</div>
      <div class="muted">${esc([o.service,o.temp,o.city,o.region].filter(Boolean).join(" · "))}${o.warehouse?` · WHS: ${esc(o.warehouse)}`:""}</div>
      ${o.summary?`<div>${esc(o.summary)}</div>`:""}
      <div class="metrics">${m}</div>
    </div>
    <details class="more"${open?" open":""}><summary>Timeline and lessons</summary>
      <div class="more-body">
        ${tl?`<ol class="timeline">${tl}</ol>`:""}
        <div class="lists"><div><span class="eyebrow">What went right</span><ul>${li(o.wentRight)}</ul></div>
        <div><span class="eyebrow">What to improve</span><ul>${li(o.improve)}</ul></div></div>
        ${o.slack?`<div class="note">Slack: <span class="mono">#${esc(o.slack)}</span></div>`:""}
      </div></details>
  </article>`;
}

function emptyBox(what){
  return `<div class="empty">${loaded ? `No ${what} yet. Send Claude a WN# and it will add the order and everything it teaches.` : (db===null && loaded===false && syncFailed ? "Open this page signed in to claude.ai to load the board." : `Loading ${what}…`)}</div>`;
}
let syncFailed = false;

const VIEWS = {
  overview(){
    const recent = [...state.orders].sort(byDate).slice(0,3);
    const rules = [...state.rules].sort(byDate).slice(0,5);
    return relayHtml() + `<div class="grid2">
      <div class="box"><h2>Latest orders</h2>${recent.length?recent.map(o=>orderCard(o,false)).join(""):emptyBox("orders")}</div>
      <div class="box"><h2>Newest rules</h2>${rules.length?rules.map(ruleRow).join(""):emptyBox("rules")}
        <div class="howto"><span class="eyebrow">Add to this board</span>
        <span>Tell Claude: <code>study WN-13114</code>. It reads the Slack channel and adds the order, rules, warehouses, terms and questions here.</span></div></div>
    </div>`;
  },
  orders(){
    const svcs = ["All",...new Set(state.orders.map(o=>o.service).filter(Boolean))];
    const list = state.orders.filter(o=>ui.svc==="All"||o.service===ui.svc).sort(wnSort);
    return `<div class="chips" role="group" aria-label="Filter by service">${svcs.map(s=>`<button class="chip" data-svc="${esc(s)}" aria-pressed="${ui.svc===s}">${esc(s)}</button>`).join("")}</div>
      ${list.length?list.map(o=>orderCard(o,false)).join(""):emptyBox("orders")}`;
  },
  load(){
    const subs = [["guide","Field guide"],["photos","Photo library"],["train","Train"],["checklist","Photo checklist"]];
    return `<div class="sub" role="group" aria-label="Read the Load sections">${subs.map(([k,l])=>`<button class="chip" data-loadsub="${k}" aria-pressed="${ui.loadSub===k}">${l}</button>`).join("")}</div>` + (LOAD[ui.loadSub]||LOAD.guide)();
  },
  processes(){
    if(!state.processes.length) return emptyBox("processes");
    return `<div class="grid2">${state.processes.map(p=>`<div class="box">

const SK = {
  floor:()=>`<line x1="6" y1="130" x2="234" y2="130" stroke="var(--floor)" stroke-width="2"/>`,
  pallet:(x,w)=>`<rect x="${x}" y="120" width="${w}" height="10" fill="var(--wood)"/><rect x="${x+w*.14}" y="123" width="${w*.22}" height="5" fill="var(--soft)"/><rect x="${x+w*.64}" y="123" width="${w*.22}" height="5" fill="var(--soft)"/>`,
  cases:(x,yb,cols,rows,cw,ch,fill)=>{let s="";for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+=`<rect x="${x+c*cw}" y="${yb-(r+1)*ch}" width="${cw}" height="${ch}" fill="${fill||"var(--case)"}" stroke="var(--case-line)"/>`;return s;},
  wrap:(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--wrap)" fill-opacity=".2" stroke="var(--wrap)" stroke-width="1.5"/>`,
  ring:(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 3"/>`,
  note:(x,y,t,c)=>`<text x="${x}" y="${y}" font-family="IBM Plex Mono,monospace" font-size="10" fill="${c||"var(--bad)"}">${t}</text>`,
  bar:(y)=>`<line x1="14" y1="${y}" x2="226" y2="${y}" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>`,
  stack:(x)=>SK.pallet(x,72)+SK.cases(x,120,3,5,24,18)+SK.wrap(x-1,28,74,96)
};
function sketch(kind){
  const v = b => `<svg viewBox="0 0 240 150" role="img" aria-label="${esc(kind)} drawing">${b}</svg>`;
  switch(kind){
    case "good": return v(SK.floor()+SK.stack(30)+SK.stack(130)+SK.bar(70)+SK.note(14,20,"square · wrapped · load bar","var(--good)"));
    case "lean": return v(SK.floor()+SK.stack(20)+SK.pallet(140,72)+`<g transform="translate(176,120) skewX(-16) translate(-176,-120)">${SK.cases(140,120,3,5,24,18)}${SK.wrap(139,28,74,92)}</g>`+SK.ring(108,22,70,52)+SK.note(112,16,"top leaning over"));
    case "collapsed": return v(SK.floor()+SK.stack(20)+SK.pallet(130,72)+SK.cases(130,120,3,2,24,18)+`<g fill="var(--case)" stroke="var(--case-line)"><rect x="150" y="70" width="24" height="18" transform="rotate(-25 162 79)"/><rect x="184" y="108" width="24" height="18" transform="rotate(18 196 117)"/><rect x="206" y="112" width="24" height="18" transform="rotate(-8 218 121)"/><rect x="176" y="62" width="24" height="18" transform="rotate(40 188 71)"/></g>`+SK.ring(140,52,96,80)+SK.note(128,44,"cases on floor"));
    case "wrapshort": return v(SK.floor()+SK.pallet(80,72)+SK.cases(80,120,3,2,24,18)+SK.cases(88,84,3,3,24,18)+SK.wrap(87,30,74,56)+SK.ring(74,84,92,40)+SK.note(10,146,"no wrap on the bottom tiers")+SK.note(164,58,"slid off"));
    case "sideways": return v(`<rect x="12" y="20" width="200" height="110" fill="none" stroke="var(--floor)" stroke-width="2"/><line x1="212" y1="20" x2="212" y2="130" stroke="var(--accent)" stroke-width="4"/>`+SK.note(214,16,"door","var(--accent-ink)")+
      [[30,30,0],[30,80,0],[95,30,0],[95,80,1],[160,30,1],[160,80,0]].map(([x,y,bad])=>`<rect x="${x}" y="${y}" width="50" height="40" fill="var(--case)" stroke="var(--case-line)"/>`+(bad?`<rect x="${x+10}" y="${y}" width="10" height="4" fill="var(--wood)"/><rect x="${x+30}" y="${y}" width="10" height="4" fill="var(--wood)"/>`+SK.ring(x-4,y-4,58,48):`<rect x="${x+46}" y="${y+8}" width="4" height="9" fill="var(--wood)"/><rect x="${x+46}" y="${y+23}" width="4" height="9" fill="var(--wood)"/>`)).join("")+SK.note(14,145,"openings must face the door"));
    case "overhang": return v(SK.floor()+SK.pallet(84,72)+SK.cases(72,120,4,4,24,18)+SK.ring(64,46,22,78)+SK.ring(154,46,22,78)+SK.note(40,36,"cases hang past the pallet edge"));
    case "crushed": return v(SK.floor()+SK.pallet(84,72)+SK.cases(84,120,3,3,24,18)+`<path d="M84 66 Q120 74 156 66 L156 56 Q120 64 84 56Z" fill="var(--case-line)" stroke="var(--case-line)"/>`+`<rect x="84" y="46" width="72" height="10" fill="var(--wood)"/>`+SK.cases(84,46,3,2,24,18)+SK.ring(76,50,88,24)+SK.note(8,145,"bottom pallet's top tier crushed"));
    case "broken": return v(SK.floor()+`<rect x="84" y="120" width="72" height="10" fill="var(--wood)"/><path d="M114 120 l6 5 l-4 2 l6 3" stroke="var(--bad)" stroke-width="2" fill="none"/>`+SK.cases(84,120,1,5,24,18)+SK.cases(108,126,1,5,24,18)+SK.cases(132,120,1,5,24,18)+SK.ring(100,96,40,40)+SK.note(20,24,"cracked deck board, middle sags"));
    case "gaps": return v(`<rect x="12" y="20" width="200" height="110" fill="none" stroke="var(--floor)" stroke-width="2"/><line x1="212" y1="20" x2="212" y2="130" stroke="var(--accent)" stroke-width="4"/>`+SK.note(214,16,"door","var(--accent-ink)")+[[16,24],[16,76],[70,24],[70,76]].map(([x,y])=>`<rect x="${x}" y="${y}" width="50" height="48" fill="var(--case)" stroke="var(--case-line)"/>`).join("")+SK.ring(126,26,82,98)+SK.note(142,74,"empty,")+SK.note(142,88,"no bars")+SK.note(14,145,"top view · nothing holds it"));
    case "wet": return v(SK.floor()+SK.pallet(84,72)+SK.cases(84,120,3,5,24,18)+SK.cases(84,120,3,2,24,18,"var(--case-line)")+`<g stroke="var(--wrap)" stroke-width="2" stroke-linecap="round"><line x1="96" y1="90" x2="96" y2="98"/><line x1="120" y1="88" x2="120" y2="100"/><line x1="144" y1="92" x2="144" y2="99"/></g><rect x="190" y="40" width="10" height="60" rx="5" fill="none" stroke="var(--muted)" stroke-width="2"/><circle cx="195" cy="104" r="8" fill="var(--bad)"/><rect x="193" y="62" width="4" height="40" fill="var(--bad)"/>`+SK.ring(78,80,84,44)+SK.note(14,24,"soft wet bottoms · check reefer temp"));
    case "seal": return v(`<rect x="30" y="20" width="80" height="110" fill="var(--soft)" stroke="var(--floor)" stroke-width="2"/><rect x="112" y="20" width="80" height="110" fill="var(--soft)" stroke="var(--floor)" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="130" stroke="var(--muted)" stroke-width="4"/><line x1="160" y1="20" x2="160" y2="130" stroke="var(--muted)" stroke-width="4"/><circle cx="160" cy="80" r="7" fill="none" stroke="var(--t-cov)" stroke-width="3"/><rect x="150" y="88" width="50" height="14" rx="3" fill="var(--t-cov)"/><text x="153" y="98" font-family="IBM Plex Mono,monospace" font-size="9" fill="#fff">7959923</text>`+SK.note(8,145,"seal # must match the BOL","var(--good)"));
    default: return v(SK.floor()+SK.stack(84));
  }
}

    const defs = [...document.querySelectorAll('#upform input[name=def]:checked')].map(x=>x.value);
    await db.collection("photos").add({asset:up.id, wn:$("#upwn").value.trim().replace(/^WN-?/i,""), title:$("#uptitle").value.trim(),
      verdict:$("#upverdict").value, stage:$("#upstage").value, defects:defs, lesson:$("#uplesson").value.trim(), spots:[], order:50, date:new Date().toISOString().slice(0,10)});
    flash("Photo added");
  }catch(err){ msg.textContent = "Upload failed: " + (err && err.message || "try a smaller image"); }
}
function flash(msg){ const s=$("#syncState"); s.textContent = msg; clearTimeout(flash.t); flash.t=setTimeout(()=>s.textContent = loaded?"Live":"", 2500); }

render();
(async()=>{
  db = window.claude?.use ? await window.claude.use("db") : null;
  if(!db){ syncFailed = true; $("#syncState").textContent = "Offline: open in claude.ai to load"; render(); return; }
  window.claude.use("assets").then(a=>{ assets = a; render(); }).catch(()=>{});
  try{ const user = await window.claude.use("user"); const w = user?.can ? user.can("data.write") : null; if(w===false) canWrite=false; }catch(e){}
  let pending = new Set(COLS);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      state[c] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      pending.delete(c); if(!pending.size){ loaded = true; $("#syncState").textContent = "Live"; }
      render();
    }, err=>{ pending.delete(c); $("#syncState").textContent = "Couldn't load " + c; });
  });
})();
</script>
